epochs: 200
patience: 50
imgsz: 640
batch: 16
workers: 16
cache: 'ram'
compile: False

# general
optimizer: 'MuSGD'
lr0: 0.001
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005

# warmup
warmup_epochs: 8
warmup_momentum: 0.75

# flags
single_cls: True
cos_lr: True

# penalties
cls: 0.5
box: 7.5
dfl: 1.5

# geometric
degrees: 12.5
translate: 0.15
scale: 0.6
shear: 3.0
perspective: 0.0002

# flips
fliplr: 0.5
flipud: 0.0

# color / lighting
hsv_h: 0.015
hsv_s: 0.8
hsv_v: 0.5
bgr: 0.0

# compositional
mosaic: 0.85
close_mosaic: 20
mixup: 0.15
cutmix: 0.0