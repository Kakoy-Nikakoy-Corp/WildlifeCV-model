epochs: 300
patience: 15
imgsz: 960
batch: 16

lr0: 0.003
lrf: 0.01
weight_decay: 0.001

# geometric
degrees: 8.0
translate: 0.15
scale: 0.6
shear: 2.0
perspective: 0.0005

# flips
fliplr: 0.5
flipud: 0.0

# color / lighting
hsv_h: 0.02
hsv_s: 0.6
hsv_v: 0.5

# compositional
mosaic: 0.8
close_mosaic: 10
mixup: 0.15
copy_paste: 0.2

# occlusion / robustness
erasing: 0.25
