epochs: 300
patience: 60
imgsz: 736
batch: 32

optimizer: 'AdamW'
lr0: 0.001
lrf: 0.01
weight_decay: 0.0005
single_cls: True
cos_lr: True

# penalties
cls: 0.3
box: 8.5
dfl: 2.0

# geometric
degrees: 12.0
translate: 0.2
scale: 0.6
shear: 6.0
perspective: 0.0005

# flips
fliplr: 0.5
flipud: 0.0

# color / lighting
hsv_h: 0.015
hsv_s: 0.5
hsv_v: 0.4

# compositional
mosaic: 0.8
close_mosaic: 20
mixup: 0.2

# occlusion / robustness
erasing: 0.2