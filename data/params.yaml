epochs: 100
patience: 30
imgsz: 640
batch: 24
workers: 16
cache: 'disk'
compile: True

# general
optimizer: 'MuSGD'
lr0: 0.0007
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005

# warmup
warmup_epochs: 8
warmup_momentum: 0.75

# flags
single_cls: True
cos_lr: True

# penalties
cls: 0.5
box: 7.5
dfl: 1.5

# geometric
degrees: 15.0
translate: 0.1
scale: 0.6
shear: 5.0
perspective: 0.0002

# flips
fliplr: 0.5
flipud: 0.0

# color / lighting
hsv_h: 0.015
hsv_s: 1.0
hsv_v: 0.6
bgr: 0.0

# compositional
mosaic: 1.0
close_mosaic: 20
mixup: 0.15
cutmix: 0.0