epochs: 300
patience: 60
imgsz: 640
batch: 40
workers: 16
cache: 'ram'
compile: 'max-autotune-no-cudagraphs'

# general
optimizer: 'AdamW'
lr0: 0.0001
lrf: 0.01
momentum: 0.95
weight_decay: 0.0007

# warmup
warmup_epochs: 8
warmup_momentum: 0.75

# flags
single_cls: True
cos_lr: True

# penalties
cls: 0.2
box: 10.0
dfl: 1.5

# geometric
degrees: 25.0
translate: 0.2
scale: 0.7
shear: 9.0
perspective: 0.0005

# flips
fliplr: 0.5
flipud: 0.0

# color / lighting
hsv_h: 0.015
hsv_s: 1.0
hsv_v: 0.5
bgr: 0.0

# compositional
mosaic: 0.85
close_mosaic: 10
mixup: 0.0
cutmix: 0.0