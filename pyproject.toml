[project]
name = "wildlifecv-model"
version = "1.0.0"
description = "YOLO26 training/inference scripts for WildlifeCV project"
readme = "README.md"
requires-python = "==3.12.3"
dependencies = [
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "ultralytics>=8.4.51",
    "mlflow>=3.12.0",
    "psycopg2>=2.9.12",
    "boto3>=1.43.9",
    "python-dotenv>=1.2.2"
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-cu132", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-cu132", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes (errors)
    "UP",  # pyupgrade (modernize code for newer Python)
    "B",   # flake8-bugbear (common bugs and security issues)
    "SIM", # flake8-simplify (simplify code)
    "I",   # isort (import sorting),
    "W",
    "C901"
]
ignore = []

[tool.uv]
package = true

[project.scripts]
train = "runner:train"
tune = "runner:tune"
validate = "runner:validate"
export = "runner:export"
serve-ui = "runner:serve_ui"